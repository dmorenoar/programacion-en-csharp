  <g mask="url(#m)">
    <text x="700" y="395" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="330" fill="none" stroke="#a78bfa" stroke-opacity=".22" stroke-width="3">C#</text>
    <text x="1405" y="140" font-family="ui-monospace,Consolas,monospace" font-size="120" fill="none" stroke="#4ec9b0" stroke-opacity=".28" stroke-width="2.5">{ }</text>
    <text x="1415" y="320" font-family="ui-monospace,Consolas,monospace" font-size="86" fill="none" stroke="#f78c6c" stroke-opacity=".25" stroke-width="2.5">&lt;/&gt;</text>
    <g opacity=".85">
<text x="600" y="66" font-family="ui-monospace,'Cascadia Code',Consolas,Menlo,monospace" font-size="17" xml:space="preserve">
<tspan x="600" y="66"><tspan fill="#6a7a9a">// Mi primer programa en C#</tspan></tspan>
<tspan x="600" y="93"><tspan fill="#c792ea">using</tspan><tspan fill="#9aa3c7"> System;</tspan></tspan>
<tspan x="600" y="120"></tspan>
<tspan x="600" y="147"><tspan fill="#c792ea">class</tspan><tspan fill="#4ec9b0"> Program</tspan></tspan>
<tspan x="600" y="174"><tspan fill="#9aa3c7">{</tspan></tspan>
<tspan x="600" y="201"><tspan fill="#9aa3c7">    </tspan><tspan fill="#c792ea">static void</tspan><tspan fill="#82aaff"> Main</tspan><tspan fill="#9aa3c7">()</tspan></tspan>
<tspan x="600" y="228"><tspan fill="#9aa3c7">    {</tspan></tspan>
<tspan x="600" y="255"><tspan fill="#9aa3c7">        </tspan><tspan fill="#c792ea">int</tspan><tspan fill="#9aa3c7"> nivel = </tspan><tspan fill="#f78c6c">1</tspan><tspan fill="#9aa3c7">;</tspan></tspan>
<tspan x="600" y="282"><tspan fill="#9aa3c7">        </tspan><tspan fill="#c792ea">string</tspan><tspan fill="#9aa3c7"> heroe = </tspan><tspan fill="#ecc48d">"Zelda"</tspan><tspan fill="#9aa3c7">;</tspan></tspan>
<tspan x="600" y="309"></tspan>
<tspan x="600" y="336"><tspan fill="#9aa3c7">        </tspan><tspan fill="#c792ea">for</tspan><tspan fill="#9aa3c7"> (</tspan><tspan fill="#c792ea">int</tspan><tspan fill="#9aa3c7"> i = </tspan><tspan fill="#f78c6c">0</tspan><tspan fill="#9aa3c7">; i &lt; </tspan><tspan fill="#f78c6c">3</tspan><tspan fill="#9aa3c7">; i++)</tspan></tspan>
<tspan x="600" y="363"><tspan fill="#9aa3c7">            </tspan><tspan fill="#4ec9b0">Console</tspan><tspan fill="#9aa3c7">.</tspan><tspan fill="#82aaff">WriteLine</tspan><tspan fill="#9aa3c7">(</tspan><tspan fill="#ecc48d">$"Hola {heroe} {i}"</tspan><tspan fill="#9aa3c7">);</tspan></tspan>
<tspan x="600" y="390"><tspan fill="#9aa3c7">    }</tspan></tspan>
<tspan x="600" y="417"><tspan fill="#9aa3c7">}</tspan></tspan>
</text>
<text x="1020" y="92" font-family="ui-monospace,'Cascadia Code',Consolas,Menlo,monospace" font-size="17" xml:space="preserve">
<tspan x="1020" y="92"><tspan fill="#6a7a9a">// Arrays y bucles</tspan></tspan>
<tspan x="1020" y="119"><tspan fill="#c792ea">int</tspan><tspan fill="#9aa3c7">[] vidas = { </tspan><tspan fill="#f78c6c">3</tspan><tspan fill="#9aa3c7">, </tspan><tspan fill="#f78c6c">5</tspan><tspan fill="#9aa3c7">, </tspan><tspan fill="#f78c6c">8</tspan><tspan fill="#9aa3c7"> };</tspan></tspan>
<tspan x="1020" y="146"></tspan>
<tspan x="1020" y="173"><tspan fill="#c792ea">foreach</tspan><tspan fill="#9aa3c7"> (</tspan><tspan fill="#c792ea">var</tspan><tspan fill="#9aa3c7"> v </tspan><tspan fill="#c792ea">in</tspan><tspan fill="#9aa3c7"> vidas)</tspan></tspan>
<tspan x="1020" y="200"><tspan fill="#9aa3c7">{</tspan></tspan>
<tspan x="1020" y="227"><tspan fill="#9aa3c7">    </tspan><tspan fill="#c792ea">if</tspan><tspan fill="#9aa3c7"> (v &gt; </tspan><tspan fill="#f78c6c">4</tspan><tspan fill="#9aa3c7">)</tspan></tspan>
<tspan x="1020" y="254"><tspan fill="#9aa3c7">        </tspan><tspan fill="#4ec9b0">Console</tspan><tspan fill="#9aa3c7">.</tspan><tspan fill="#82aaff">WriteLine</tspan><tspan fill="#9aa3c7">(</tspan><tspan fill="#ecc48d">"¡Fuerte!"</tspan><tspan fill="#9aa3c7">);</tspan></tspan>
<tspan x="1020" y="281"><tspan fill="#9aa3c7">}</tspan></tspan>
<tspan x="1020" y="308"></tspan>
<tspan x="1020" y="335"><tspan fill="#c792ea">int</tspan><tspan fill="#82aaff"> Suma</tspan><tspan fill="#9aa3c7">(</tspan><tspan fill="#c792ea">int</tspan><tspan fill="#9aa3c7"> a, </tspan><tspan fill="#c792ea">int</tspan><tspan fill="#9aa3c7"> b) =&gt; a + b;</tspan></tspan>
<tspan x="1020" y="362"><tspan fill="#4ec9b0">Console</tspan><tspan fill="#9aa3c7">.</tspan><tspan fill="#82aaff">WriteLine</tspan><tspan fill="#9aa3c7">(</tspan><tspan fill="#82aaff">Suma</tspan><tspan fill="#9aa3c7">(</tspan><tspan fill="#f78c6c">2</tspan><tspan fill="#9aa3c7">, </tspan><tspan fill="#f78c6c">3</tspan><tspan fill="#9aa3c7">));</tspan></tspan>
</text>
    </g>
